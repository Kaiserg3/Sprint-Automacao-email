<h2>Criar conta</h2>

{# messages = os avisos de sucesso/erro enviados pelas views via django.contrib.messages #}
{% if messages %}
  <ul>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Criar conta</button>
</form>

<p>Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
